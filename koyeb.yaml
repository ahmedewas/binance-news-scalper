name: binance-news-scalper
services:
  - name: web
    type: web
    git:
      branch: main
    build:
      dockerfile: Dockerfile
    regions:
      - fra
    ports:
      - port: 8080
        path: /
    instance_types:
      - type: nano
    scalings:
      - min: 1
        max: 1
    env:
      - key: TRADING_MODE
        value: PAPER
      - key: PORT
        value: "8080"
      - key: HOST
        value: "0.0.0.0"
